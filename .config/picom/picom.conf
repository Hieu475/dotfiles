# Minimal picom: vsync (fixes tearing on the hybrid laptop), soft corners, light fade.
backend = "glx";
vsync = true;
use-damage = false;

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'"
];

shadow = false;

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;
