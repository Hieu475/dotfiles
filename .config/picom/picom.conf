# Minimal picom: vsync (fixes tearing on the hybrid laptop), soft corners, light fade.
backend = "glx";
vsync = true;
use-damage = true;   # set back to false if you see flicker or tearing

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'"
];

shadow = false;

fading = false;
